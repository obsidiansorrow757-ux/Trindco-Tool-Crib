<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trindco Tool Crib</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1c2027">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tool Crib">
<style>
:root{
  --bg:#14171c; --panel:#1c2027; --panel2:#232831; --line:#2f3540; --text:#e6e9ee; --mute:#8d96a5;
  --accent:#f28c28; --accent2:#ffb15c; --ok:#3fb27f; --low:#e3b341; --out:#e5534b; --info:#4f9cf0;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.nav{width:210px;background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;flex-shrink:0;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:16px;padding:4px 10px 18px;letter-spacing:.3px}
.brand span{color:var(--accent)}
.nav button{display:flex;align-items:center;justify-content:space-between;width:100%;background:none;border:0;padding:10px 12px;border-radius:6px;cursor:pointer;color:var(--mute);text-align:left}
.nav button:hover{background:var(--panel2);color:var(--text)}
.nav button.active{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
.nav .pill{background:var(--out);color:#fff;border-radius:10px;padding:0 7px;font-size:12px;font-weight:600}
.nav .foot{position:absolute;bottom:14px;left:20px;right:10px;color:var(--mute);font-size:12px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.top h1{font-size:18px;margin:0;flex:1;min-width:140px}
.top input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:240px}
#main{padding:20px 22px 60px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#1a1205;font-weight:600}
.btn.pri:hover{background:var(--accent2)}
.btn.danger{border-color:#6b2a27;color:#ff9a94}
.btn.sm{padding:3px 8px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-size:24px;font-weight:700}
.kpi .l{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
.kpi.warn .v{color:var(--low)} .kpi.bad .v{color:var(--out)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px;overflow:hidden}
.card>.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>.hd h3{margin:0;font-size:15px;flex:1}
.mname{display:flex;align-items:center;gap:8px}
.cab-ico{height:44px;width:auto;flex-shrink:0;margin:-10px 4px}
.cnc-ico{width:52px;height:auto;flex-shrink:0;margin:-8px 0}
.card>.bd{padding:14px 16px}
.card>.bd.flush{padding:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{white-space:nowrap;padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--mute);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px;background:var(--panel2);white-space:nowrap}
tr.click{cursor:pointer} tr.click:hover td{background:#20252d}
td.num,th.num{text-align:right}
td.act{white-space:nowrap;text-align:right}
.code{font-family:ui-monospace,Consolas,monospace;color:var(--accent2);font-weight:600}
.mute{color:var(--mute)}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.b-ok{background:#1d3b2e;color:var(--ok)} .b-low{background:#3d3317;color:var(--low)} .b-out{background:#45201e;color:var(--out)} .b-ord{background:#1a2f4a;color:var(--info)}
.b-new{background:#1d3b2e;color:var(--ok)} .b-edm{background:#3a3020;color:#d9a85b}
.pockets{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pocket{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;min-height:86px;position:relative}
.pocket:hover{border-color:var(--accent)}
.pocket .pn{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.5px}
.pocket.empty{border-style:dashed;color:var(--mute)}
.pocket.loaded{border-left:3px solid var(--accent)}
.pocket .tn{font-size:12px;margin-top:2px}
.mini{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.mini span{width:26px;height:20px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);font-size:10px;display:flex;align-items:center;justify-content:center;color:var(--mute)}
.mini span.on{background:#3a2a17;border-color:var(--accent);color:var(--accent2)}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:4px}
.f input,.f select,.f textarea,td input,td select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
td input{padding:4px 6px;max-width:80px}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fgrid .full{grid-column:1/-1}
.f input:focus,.f select:focus,td input:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.chk{display:flex;gap:8px;align-items:flex-start;color:var(--text);font-size:13px}
.chk input{width:auto;margin-top:3px}
.note{background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--info);border-radius:6px;padding:8px 10px;font-size:13px;color:var(--mute)}
.note.warn{border-left-color:var(--low)}
.empty-state{padding:30px;text-align:center;color:var(--mute)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto}
.hidden{display:none!important}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:100%;max-width:620px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mh h2{margin:0;font-size:16px;flex:1}
.modal .x{background:none;border:0;font-size:22px;color:var(--mute);cursor:pointer}
.modal .mb{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.modal .mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.modal .mf .left{margin-right:auto}
/* logo splash shown when opening the Dashboard: flips in, holds, flips away to the page */
.splash{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(12,14,18,.9);cursor:pointer;padding:16px;perspective:1200px;opacity:1;transition:opacity .25s ease}
.splash.fade{opacity:0}
.splash img{width:min(560px,86vw);height:auto;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.55);backface-visibility:hidden;transform-origin:50% 50%}
.splash.in img{animation:flipIn .45s cubic-bezier(.2,.8,.2,1) both}
.splash.out img{animation:flipOut .35s cubic-bezier(.6,0,.8,.2) both}
@keyframes flipIn{from{transform:rotateY(-90deg) scale(.9);opacity:.2}to{transform:rotateY(0) scale(1);opacity:1}}
@keyframes flipOut{from{transform:rotateY(0) scale(1)}to{transform:rotateY(90deg) scale(.9);opacity:.2}}
#main.flipin{animation:pageIn .35s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 0}
@keyframes pageIn{from{transform:perspective(1400px) rotateY(-12deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.splash.in img,.splash.out img,#main.flipin{animation:none}}
tr.grp td{background:#232a34;cursor:pointer;border-top:1px solid var(--line)}
tr.grp:hover td{background:#283040}
tr.grp td{padding-top:10px;padding-bottom:10px}
tr.grp .caret{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;margin-right:10px;vertical-align:middle;border-radius:7px;
  background:rgba(242,140,40,.16);border:1px solid rgba(242,140,40,.55);color:var(--accent);transition:transform .18s ease,background .15s}
tr.grp:hover .caret{background:var(--accent);color:#1a1205}
tr.grp.open .caret{transform:rotate(90deg);background:var(--accent);color:#1a1205}
tr.grp b{font-size:15px;vertical-align:middle}
tr.grp .mute{vertical-align:middle}
tr.sub td:first-child{padding-left:30px}
/* sign-in screen */
.login-ov{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.login-box{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px}
.login-box img{width:100%;border-radius:10px}
.login-box h2{margin:4px 0 0;font-size:18px}
.login-box .btn{padding:11px;font-size:15px}
.err{color:var(--out);min-height:1em;font-size:13px}
.sync-pill.login{color:var(--low);background:#3d3317}
/* live sync status */
.sync-pill{font-size:12px;font-weight:600;border-radius:12px;padding:2px 10px;white-space:nowrap}
.sync-pill:empty{display:none}
.sync-pill.live{color:var(--ok);background:#1d3b2e}
.sync-pill.offline,.sync-pill.pin{color:var(--low);background:#3d3317}
#toast{position:fixed;bottom:20px;right:20px;background:var(--panel2);border:1px solid var(--accent);padding:10px 14px;border-radius:8px;opacity:0;transform:translateY(10px);transition:.2s;z-index:60;pointer-events:none}
#toast.show{opacity:1;transform:none}
@media (max-width:900px){
  .app{flex-direction:column}
  .nav{width:auto;height:auto;position:static;display:flex;overflow-x:auto;padding:8px;gap:4px}
  .brand,.nav .foot{display:none}
  .nav button{width:auto;white-space:nowrap;gap:6px}
  .grid2,.fgrid{grid-template-columns:1fr}
  .top input{width:100%}
  #main{padding:16px}
}
/* ---------- icons / small-screen helpers ---------- */
.nav .ni{flex-shrink:0;opacity:.85}
.nav button{justify-content:flex-start;gap:10px;position:relative}
.nav button .nl{flex:1}
.nav .short,.top .short{display:none}
.top{padding-top:calc(14px + env(safe-area-inset-top))}
.scan-top{display:inline-flex;align-items:center;gap:6px}
.inrow{display:flex;gap:6px;align-items:stretch}
.inrow input,.inrow textarea{flex:1;min-width:0}
.scanbtn{display:inline-flex;align-items:center;justify-content:center;padding:0 12px}
.scan-ov{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:16px}
.scan-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:100%;max-width:520px;padding:14px;display:flex;flex-direction:column;gap:10px}
.scan-hd{display:flex;align-items:center}.scan-hd b{flex:1}
.scan-hd .x{background:none;border:0;font-size:26px;line-height:1;color:var(--mute);cursor:pointer;padding:0 4px}
#scanReader{width:100%;min-height:220px;background:#000;border-radius:8px;overflow:hidden}
#scanReader video{width:100%!important;height:auto!important;display:block}
.scan-list{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#3a2a17;border:1px solid var(--accent);color:var(--accent2);border-radius:12px;padding:2px 10px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.scan-ov input{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
.ucard .big{font-size:18px;font-weight:700}
.installcard .row{margin-top:8px}

/* ---------- phone layout ---------- */
@media (max-width:760px){
  body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
  .nav{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;z-index:40;display:flex;overflow-x:auto;gap:0;
       padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:1 0 auto;min-width:68px;flex-direction:column;justify-content:center;align-items:center;gap:3px;padding:6px 8px;font-size:11px;box-shadow:none!important}
  .nav button .nl{flex:none}
  .nav button.active{color:var(--accent)}
  .nav .long,.top .long{display:none}.nav .short,.top .short{display:inline}
  .nav .pill{position:absolute;top:2px;right:10px;font-size:10px;padding:0 5px}
  .top{padding:calc(10px + env(safe-area-inset-top)) 12px 10px;gap:8px}
  .top h1{font-size:16px;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top input{order:5;flex:1 1 100%;width:100%}
  .top .btn{padding:8px 11px}
  .hide-sm{display:none!important}
  #main{padding:12px 12px 24px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .kpi{padding:10px}.kpi .v{font-size:20px}
  .grid2,.fgrid{grid-template-columns:1fr}
  .card>.hd{padding:10px 12px}
  .row{gap:8px}
  .btn{padding:9px 12px}
  .btn.sm{padding:8px 12px;font-size:13px}
  /* tables become stacked cards */
  table.resp,table.resp tbody,table.resp tr,table.resp td{display:block;width:100%}
  table.resp tr.hrow{display:none}
  table.resp tr{border-bottom:1px solid var(--line);padding:10px 12px}
  table.resp td{border:0;padding:3px 0;white-space:normal;text-align:left!important;display:flex;gap:10px;align-items:baseline}
  table.resp td[data-label]::before{content:attr(data-label);flex:0 0 92px;color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  table.resp td:empty{display:none}
  table.resp td.act{flex-wrap:wrap;gap:6px;padding-top:8px}
  table.resp td.act::before{display:none}
  table.resp td input[type=number]{max-width:110px}
  table.resp tr.grp{padding:0}
  table.resp tr.grp td{display:block;padding:12px}
  table.resp tr.sub{border-left:3px solid rgba(242,140,40,.45);padding-left:14px}
  tr.sub td:first-child{padding-left:0}
  .modal-back{padding:0;align-items:stretch}
  .modal{max-width:none!important;border-radius:0;min-height:100%;display:flex;flex-direction:column;border:0}
  .modal .mh{padding-top:calc(14px + env(safe-area-inset-top))}
  .modal .mb{flex:1}
  .modal .mf{position:sticky;bottom:0;background:var(--panel);flex-wrap:wrap;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .modal .mf .left{margin-right:0}
  input,select,textarea{font-size:16px!important}
  #toast{left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom))}
  .scan-ov{padding:0;align-items:stretch}
  .scan-box{max-width:none;border-radius:0;padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .cnc-ico{width:44px}
}
@media print{
  .nav,.top,.noprint,td.act,th.act{display:none!important}
  body,.card,.kpi{background:#fff;color:#000}
  th{background:#eee;color:#000}
}
</style>
</head>
<body>
<div class="app">
  <aside class="nav" id="nav">
    <div class="brand">Trindco <span>Tool Crib</span></div>
    <button data-v="dashboard"><svg class="ni" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span class="nl"><span class="long">Dashboard</span><span class="short">Dashboard</span></span></button>
    <button data-v="machines"><svg class="ni" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="17" width="20" height="4" rx="1"/><path d="M4 17V6h16v11"/><rect x="10" y="4" width="4" height="7" rx="1"/><path d="M12 11v3"/></svg><span class="nl"><span class="long">Machines</span><span class="short">Machines</span></span></button>
    <button data-v="cabinet"><svg class="ni" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="1.5"/><path d="M5 8h14M5 14h14M10 5h4M10 11h4M10 17h4"/></svg><span class="nl"><span class="long">Cabinets</span><span class="short">Cabinets</span></span></button>
    <button data-v="tools"><svg class="ni" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h2M3 12h2M3 18h2M8 6h13M8 12h13M8 18h13"/></svg><span class="nl"><span class="long">Tools (Serials)</span><span class="short">Tools</span></span></button>
    <button data-v="products"><svg class="ni" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg><span class="nl"><span class="long">Products</span><span class="short">Products</span></span></button>
    <button data-v="reorder"><svg class="ni" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11.5l2-8H6.2"/></svg><span class="nl"><span class="long">Re-Order</span><span class="short">Re-Order</span></span> <span class="pill hidden" id="roPill"></span></button>
    <button data-v="history"><svg class="ni" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="nl"><span class="long">History</span><span class="short">History</span></span></button>
    <button data-v="settings"><svg class="ni" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg><span class="nl"><span class="long">Settings</span><span class="short">Settings</span></span></button>
    <div class="foot" id="userFoot"></div>
  </aside>
  <main>
    <header class="top">
      <h1 id="viewTitle"></h1><span id="syncPill" class="sync-pill"></span>
      <input id="search" placeholder="Search serial #, product, part #, batch…">
      <button class="btn scan-top" onclick="scanFind()" title="Scan a serial #"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg><span class="lbl">Scan</span></button>
      <button class="btn hide-sm" onclick="unitModal()">+ Add tool</button>
      <button class="btn pri" onclick="allocateModal()"><span class="long">Allocate to Machine</span><span class="short">Allocate</span></button>
    </header>
    <section id="main"></section>
  </main>
</div>
<div id="modalBack" class="modal-back hidden"><div class="modal" id="modal"></div></div>
<div id="toast"></div>
<div id="loginOv" class="login-ov hidden"><form class="login-box" onsubmit="event.preventDefault();doLogin()">
  <img id="loginLogo" alt="Trindco Tool Crib">
  <h2 id="loginTitle">Sign in</h2><div id="loginHint" class="mute"></div>

const prod = id => S.products.find(p => p.id === id);

const unitBySerial = s => S.units.find(u => norm(u.serial) === norm(s));

const kindOf = u => (loc(u.locId) || {}).kind;
function slotsFor(l){ if(!l) return []; return l.kind === 'machine' ? [MACHINE_SLOT] : (l.bins && l.bins.length ? l.bins : ['Main']); }
function whereLS(locId, slot){ const l = loc(locId); if(!l) return '?'; return l.kind === 'machine' ? l.name : `${l.name} › ${slot}`; }

const avail = p => unitsOf(p.id, S.settings.reorderBasis === 'all' ? null : 'cabinet').length;
const needsReorder = p => (+p.reorderPoint || 0) > 0 && avail(p) + onOrder(p.id) <= +p.reorderPoint;

  let locs = null, user = 'Rob';
  try{

    if(old && Array.isArray(old.locations) && old.locations.length){
      locs = old.locations.map(l => l.kind === 'machine' ? {id:l.id, name:l.name, kind:'machine', model:l.model || ''} : {id:l.id, name:l.name, kind:'cabinet', bins:l.bins || ['Main']});

const FRESH_VER = 1;
function upgrade(d){
  if((d.settings.freshVer || 0) >= FRESH_VER) return d;
  const f = emptyState(d.locations, d.settings.user);
  f.settings.reorderBasis = d.settings.reorderBasis || 'cabinet';

/* =========================================================
   LIVE SYNC — shares one inventory between every phone / PC through the
   Netlify function at /api/inventory. Each record carries _t (last edit time);
   newest edit wins, deletions are kept as tombstones, history is merged.
   Without the function (e.g. opened as a file) the app simply stays local.
   ========================================================= */
const SYNC = {url:'/api/inventory', on:false, status:'local', rev:0, busy:false, pending:false, timer:null, lastOk:null, lastPush:0};
const COLS = ['locations','products','units','orders'];

const stripT = r => { const {_t, ...x} = r; return JSON.stringify(x); };
const sharedSettings = () => { const {user, _t, ...x} = S.settings || {}; return JSON.stringify(x); };
let synced = new Map();
function snapshot(){ synced = new Map(); COLS.forEach(c => (S[c] || []).forEach(r => synced.set(r.id, stripT(r)))); synced.set('__settings', sharedSettings()); }
function stamp(){
  const now = Date.now(), seen = new Set(); S.deleted ||= {};
  COLS.forEach(c => (S[c] || []).forEach(r => { seen.add(r.id); const j = stripT(r); if(synced.get(r.id) !== j){ r._t = now; synced.set(r.id, j); } }));
  for(const id of [...synced.keys()]) if(id !== '__settings' && !seen.has(id)){ S.deleted[id] = now; synced.delete(id); }
  const sj = sharedSettings(); if(synced.get('__settings') !== sj){ S.settings._t = now; synced.set('__settings', sj); }

function mergeState(a, b){

    out[c] = [...m.values()].filter(r => !(del[r.id] && del[r.id] >= (r._t || 0))); });

  d.log = S.log.filter(l => full || Date.parse(l.ts) > since);

async function api(method, body, qs = '', path = SYNC.url){

async function push(){

    const r = await api('POST', delta(full));

}

function handleSyncError(e){

  if(e.noServer){ SYNC.on = false; setSync('local'); hideLogin(); return; }

async function initSync(){

  catch(e){

    return;

    const r = await api('GET');
    SYNC.on = true;

    clearInterval(SYNC.poll); SYNC.poll = setInterval(pull, 8000);
  }catch(e){ handleSyncError(e); }
}

function logIt(action, u, from, to, note, productId){

    from: from || '', to: to || '', user: S.settings.user || '', note: note || ''});

function findProduct(partNo, name){
  if(norm(partNo)) return S.products.find(p => norm(p.partNo) === norm(partNo));
  return S.products.find(p => !norm(p.partNo) && norm(p.name) === norm(name));
}
function upsertProduct(f){
  let p = findProduct(f.partNo, f.name);
  if(!p){ p = {id:uid(), name:f.name, partNo:f.partNo || '', type:f.type || TYPES[0], vendor:f.vendor || '', cost:+f.cost || 0, reorderPoint:+f.reorderPoint || 0, reorderQty:+f.reorderQty || 1}; S.products.push(p); }
  else ['name','type','vendor','cost','reorderPoint'].forEach(k => { if(f[k] !== undefined && f[k] !== '') p[k] = (k === 'cost' || k === 'reorderPoint') ? +f[k] : f[k]; });
  return p;
}
function relocate(u, locId, slot, cond, action, note){
  const from = where(u);
  if(kindOf(u) === 'cabinet') u.home = {locId:u.locId, slot:u.slot};
  u.locId = locId; u.slot = slot; if(cond) u.cond = cond;

}
function homeOf(u){

}
// "CNC Tooling 2cm T Edge Pos 1 - 935124" | "CNC Tooling 366851 - Blick Top Seal 50 ft" | "CNC Tooling 3/8" RO Sink Tool Pos1 DGG83848"
const looksLikePart = t => /^[A-Za-z]{0,4}\d[\w.\-]{3,}$/.test(t) && /\d{4,}/.test(t);
function parseVariant(str){
  const s = String(str || '').replace(/^\s*CNC Tooling\s*/i, '').trim();
  const i = s.lastIndexOf(' - ');
  if(i > 0){
    const left = s.slice(0, i).trim(), right = s.slice(i + 3).trim();
    if(looksLikePart(right)) return {name:left, partNo:right};
    if(looksLikePart(left)) return {name:right, partNo:left};
    return {name:left, partNo:right};
  }
  const d = s.match(/^([A-Za-z]{0,4}\d{4,}[\w.]*)-(\S.*)$/);
  if(d) return {name:d[2].trim(), partNo:d[1]};
  const m = s.match(/^(.*\S)\s+(\S+)$/);
  if(m && looksLikePart(m[2])) return {name:m[1], partNo:m[2]};
  return {name:s, partNo:''};
}
// Batch # is the very last number ("222122 / 3" -> "3"). Text with no number (e.g. "Zenesis") is treated as the vendor.
function splitBatch(raw){
  const t = String(raw || '').trim();
  if(!t || /^(n\/?a|none|-+)$/i.test(t)) return {batch:'', vendor:''};
  if(/^[\d\s\/.\-#]+$/.test(t)){ const m = t.match(/(\d+)\D*$/); return {batch:m ? m[1] : '', vendor:''}; }
  // text like "Zenesis" or "Red Infinity 4 cm" = vendor (trailing size dropped)
  return {batch:'', vendor:t.replace(/\s*\d+(\.\d+)?\s*(cm|mm|in|")\s*$/i, '').trim()};
}
// New products named "...finger bit..." / "...core bit..." get that type automatically
const guessType = n => /finger\s*bit/i.test(n) ? 'Finger Bit' : /core\s*bit/i.test(n) ? 'Core' : '';
function importRows(rows, o){
  let added = 0; const skipped = [];
  rows.forEach(r => {
    const serial = String(r.serial || '').trim();
    if(!serial || !r.name){ skipped.push(serial || '(blank)'); return; }
    if(unitBySerial(serial)){ skipped.push(serial); return; }
    const b = splitBatch(r.batch), existing = findProduct(r.partNo, r.name);
    const p = upsertProduct({name:r.name, partNo:r.partNo, type: existing ? undefined : (guessType(r.name) || o.type), vendor: existing && existing.vendor ? undefined : b.vendor});
    const u = {id:uid(), serial, productId:p.id, batch:b.batch, locId:o.locId, slot:o.slot, cond:o.cond || 'new', added:nowIso()};
    S.units.push(u); logIt('Added', u, '', where(u), o.note || 'Import'); added++;
  });
  return {added, skipped};
}

/* ---------- grouping by profile name ("2cm T Edge Pos 1".."Pos 7" -> "2cm T Edge") ---------- */
const familyName = name => String(name || '').replace(/[\s,.\-]*\bpos(?:ition)?\.?\s*\d+\b.*$/i, '').trim() || String(name || '');
const familyOf = pid => familyName((prod(pid) || {}).name);
let openGroups = new Set(); try{ openGroups = new Set(JSON.parse(localStorage.getItem('tcOpenGroups') || '[]')); }catch(e){}
const shownGroups = {};
function saveGroups(){ try{ localStorage.setItem('tcOpenGroups', JSON.stringify([...openGroups])); }catch(e){} }
function toggleGroup(k){ openGroups.has(k) ? openGroups.delete(k) : openGroups.add(k); saveGroups(); render(); }
function setAllGroups(scope, open){ (shownGroups[scope] || []).forEach(k => open ? openGroups.add(k) : openGroups.delete(k)); saveGroups(); render(); }
function groupBy(items, famFn){
  const m = new Map(); items.forEach(i => { const f = famFn(i); if(!m.has(f)) m.set(f, []); m.get(f).push(i); });
  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0], undefined, {numeric:true}));
}
// Builds table rows: a clickable header per group (only when the group has 2+ items), then its rows when open
function groupedRows(scope, items, famFn, cols, rowFn, summaryFn){
  shownGroups[scope] = [];
  return groupBy(items, famFn).map(([fam, list]) => {
    if(list.length < 2) return list.map(i => rowFn(i, false)).join('');
    const key = scope + '|' + fam; shownGroups[scope].push(key);
    const open = openGroups.has(key) || !!query;
    return `<tr class="grp ${open ? 'open' : ''}" data-k="${esc(key)}" onclick="toggleGroup(this.dataset.k)"><td colspan="${cols}"><span class="caret"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span><b>${esc(fam)}</b> <span class="mute">· ${summaryFn(list)}</span></td></tr>` +
      (open ? list.map(i => rowFn(i, true)).join('') : '');
  }).join('');
}
const groupButtons = scope => `<button class="btn sm" onclick="setAllGroups('${scope}',true)">Expand all</button><button class="btn sm" onclick="setAllGroups('${scope}',false)">Collapse all</button>`;
const unitSummary = list => { const parts = new Set(list.map(u => u.productId)).size, cab = list.filter(u => kindOf(u) === 'cabinet').length;
  return `${list.length} tools · ${parts} part #${parts > 1 ? 's' : ''} · ${cab} in cabinet · ${list.length - cab} on machines`; };

function renderCabinet(){
  if(!cabinets().length) return `<div class="card"><div class="empty-state">No cabinets. <button class="btn" onclick="locModal(null,'cabinet')">Add cabinet</button></div></div>`;
  shownGroups.cab = [];
  return `<div class="row noprint" style="margin-bottom:14px"><button class="btn" onclick="receiveModal()">+ Receive</button>
      <button class="btn" onclick="importModal()">Paste import</button>${groupButtons('cab')}<div class="spacer"></div><button class="btn" onclick="window.print()">Print</button></div>` +
    cabinets().map(c => {
      const bins = slotsFor(c), all = S.units.filter(u => u.locId === c.id);
      const us = sortUnits(all.filter(matchesUnit));
      const row = (u, sub) => { const p = prod(u.productId) || {}; return `<tr class="${sub ? 'sub' : ''}"><td>${esc(u.slot)}</td><td class="code">${esc(u.serial)}</td><td>${esc(p.name)}</td><td>${esc(p.partNo)}</td>
        <td class="mute">${esc(u.batch)}</td><td>${condBadge(u.cond)}</td><td class="act">${unitActions(u)}</td></tr>`; };
      const prevKeys = shownGroups.cab || [];
      const rows = groupedRows('cab:' + c.id, us, u => familyOf(u.productId), 7, row, list => `${list.length} tools · ${[...new Set(list.map(u => u.slot))].sort((a, b) => bins.indexOf(a) - bins.indexOf(b)).join(', ')}`);
      shownGroups.cab = prevKeys.concat(shownGroups['cab:' + c.id]);
      return `<div class="card"><div class="hd"><h3 class="mname">${CAB_ICON}${esc(c.name)}</h3><span class="mute">${all.length} tool(s) · ${bins.length} bins</span>
        ${adminOnly(`<button class="btn sm noprint" onclick="addBinModal('${c.id}')">+ Bin</button>
        <button class="btn sm noprint" onclick="locModal('${c.id}')">Edit</button>`)}</div>
        <div class="bd flush">${rows ? `<div class="tablewrap"><table><tr><th>Bin</th><th>Serial #</th><th>Product</th><th>Part #</th><th>Batch #</th><th>Cond</th><th class="act"></th></tr>${rows}</table></div>` : '<div class="empty-state">Empty</div>'}</div></div>`;
    }).join('');
}

function renderTools(){
  let us = S.units.filter(matchesUnit).filter(u => !typeFilter || (prod(u.productId) || {}).type === typeFilter);
  if(locFilter === 'cabinet' || locFilter === 'machine') us = us.filter(u => kindOf(u) === locFilter);

      <select class="btn" onchange="typeFilter=this.value;render()"><option value="">All types</option>${TYPES.map(x => `<option ${x === typeFilter ? 'selected' : ''}>${x}</option>`).join('')}</select>

      : '<div class="empty-state">No tools match.</div>'}</div></div>`;
}

function renderProducts(){
  const q = query.toLowerCase();

    .filter(p => !typeFilter || p.type === typeFilter).sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric:true}));

    <td>${esc(p.vendor)}</td><td class="num">${money(p.cost)}</td><td class="num">${unitsOf(p.id, 'cabinet').length}</td><td class="num">${unitsOf(p.id, 'machine').length}</td>

      ${groupButtons('products')}<span class="mute">${list.length} product(s)</span></div>
    <div class="card"><div class="bd flush">${rows ? `<div class="tablewrap"><table><tr><th>Product</th><th>Part #</th><th>Type</th><th>Vendor</th><th class="num">Cost</th>
      <th class="num">Cabinet</th><th class="num">Machines</th><th class="num">On order</th><th class="num">RP</th><th>Status</th><th class="act"></th></tr>${rows}</table></div>` : '<div class="empty-state">No products.</div>'}</div></div>`;
}

function renderReorder(){
  const sug = S.products.filter(needsReorder).sort((a, b) => (a.vendor || '').localeCompare(b.vendor || '') || a.name.localeCompare(b.name, undefined, {numeric:true}));
  const sugRows = sug.map(p => `<tr><td><input type="checkbox" class="roChk" data-id="${p.id}" checked style="width:auto" onchange="roTotal()"></td>
    <td>${esc(p.name)}</td><td class="code">${esc(p.partNo)}</td><td>${esc(p.vendor)}</td><td class="num">${avail(p)}</td><td class="num">${onOrder(p.id)}</td><td class="num">${p.reorderPoint}</td>
    <td class="num"><input type="number" min="1" id="rq_${p.id}" value="${suggestQty(p)}" oninput="roTotal()"></td><td class="num">${money(p.cost)}</td><td class="num" id="ext_${p.id}"></td></tr>`).join('');
  const open = S.orders.filter(o => o.status === 'open').sort((a, b) => a.date < b.date ? 1 : -1);
  const openRows = open.map(o => `<tr><td class="code">${esc(o.po)}</td><td>${esc(o.vendor || '')}</td><td>${esc(plabel(prod(o.productId)))}</td>
    <td class="num">${o.qty}</td><td class="num">${o.recv || 0}</td><td>${fdt(o.date)}</td>
    <td class="act"><button class="btn sm pri" onclick="receiveModal('${o.productId}','${o.id}')">Receive</button> ${adminOnly(`<button class="btn sm danger" onclick="cancelOrder('${o.id}')">Cancel</button>`)}</td></tr>`).join('');
  const rpRows = S.products.slice().sort((a, b) => a.name.localeCompare(b.name, undefined, {numeric:true})).map(p => `<tr>
    <td>${esc(p.name)}</td><td class="code">${esc(p.partNo)}</td><td class="num">${unitsOf(p.id, 'cabinet').length}</td><td class="num">${unitsOf(p.id, 'machine').length}</td>
    <td class="num"><input type="number" min="0" value="${p.reorderPoint}" onchange="setRP('${p.id}','reorderPoint',this.value)"></td>
    <td class="num"><input type="number" min="0" value="${p.reorderQty}" onchange="setRP('${p.id}','reorderQty',this.value)"></td>
    <td class="num"><input type="number" min="0" step="0.01" value="${p.cost}" onchange="setRP('${p.id}','cost',this.value)"></td>
    <td id="st_${p.id}">${badge(p)}</td></tr>`).join('');
  return `<div class="row noprint" style="margin-bottom:14px">
      <div class="f" style="min-width:280px"><label>Re-order point compares against</label>
      <select ${isAdmin() ? '' : 'disabled'} onchange="S.settings.reorderBasis=this.value;commit('Re-order basis updated')">
        <option value="cabinet" ${S.settings.reorderBasis === 'cabinet' ? 'selected' : ''}>Cabinet stock only (spares)</option>
        <option value="all" ${S.settings.reorderBasis === 'all' ? 'selected' : ''}>Cabinet + tools on machines</option></select></div>
      <div class="spacer"></div>${adminOnly(`<button class="btn" onclick="manualOrderModal()">+ Manual order</button>`)}</div>
    <div class="card"><div class="hd"><h3>Suggested orders (${sug.length})</h3><span class="mute" id="roTot"></span>
      <button class="btn sm noprint" onclick="copyOrderList()">Copy list</button><button class="btn sm noprint" onclick="window.print()">Print</button>
      ${adminOnly(`<button class="btn sm pri noprint" onclick="createOrders()">Create orders for selected</button>`)}</div>
      <div class="bd flush">${sugRows ? `<div class="tablewrap"><table><tr><th></th><th>Product</th><th>Part #</th><th>Vendor</th><th class="num">Avail</th><th class="num">On order</th><th class="num">RP</th><th class="num">Order qty</th><th class="num">Unit</th><th class="num">Ext</th></tr>${sugRows}</table></div>`
        : '<div class="empty-state">Nothing at or below its re-order point.</div>'}</div></div>
    <div class="card"><div class="hd"><h3>Open orders (${open.length})</h3></div>
      <div class="bd flush">${openRows ? `<div class="tablewrap"><table><tr><th>PO</th><th>Vendor</th><th>Product</th><th class="num">Qty</th><th class="num">Rec'd</th><th>Ordered</th><th class="act"></th></tr>${openRows}</table></div>` : '<div class="empty-state">No open orders.</div>'}</div></div>
    ${adminOnly(`<div class="card noprint"><div class="hd"><h3>Re-order point setup (per part #)</h3><span class="mute">Saves automatically. Suggests an order when available + on order ≤ RP.</span></div>
      <div class="bd flush"><div class="tablewrap"><table><tr><th>Product</th><th>Part #</th><th class="num">Cabinet</th><th class="num">Machines</th><th class="num">Re-order point</th><th class="num">Re-order qty</th><th class="num">Unit cost</th><th>Status</th></tr>${rpRows}</table></div></div></div>`)}`;

function roTotal(){
  let tot = 0;
  document.querySelectorAll('.roChk').forEach(c => { const p = prod(c.dataset.id), ext = num(val('rq_' + p.id)) * (+p.cost || 0);
    const e = document.getElementById('ext_' + p.id); if(e) e.textContent = money(ext); if(c.checked) tot += ext; });
  const el = $('#roTot'); if(el) el.textContent = 'Selected total: ' + money(tot);
}
function setRP(id, f, v){
  if(!needAdmin()) return render();
  const p = prod(id); p[f] = f === 'cost' ? num(v) : Math.max(0, Math.round(num(v))); save();
  const st = document.getElementById('st_' + id); if(st) st.innerHTML = badge(p);
  const n = S.products.filter(needsReorder).length, pill = $('#roPill'); pill.textContent = n; pill.classList.toggle('hidden', !n);
  toast('Saved');
}
function nextPO(){
  const d = new Date(), ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  return `PO-${ymd}-${new Set(S.orders.filter(o => (o.po || '').startsWith('PO-' + ymd)).map(o => o.po)).size + 1}`;
}
function createOrders(){
  if(!needAdmin()) return;
  const sel = [...document.querySelectorAll('.roChk')].filter(c => c.checked).map(c => prod(c.dataset.id));
  if(!sel.length) return toast('Nothing selected');
  const byV = {}; sel.forEach(p => (byV[p.vendor || '(no vendor)'] ||= []).push(p));
  Object.entries(byV).forEach(([v, ps]) => { const po = nextPO();
    ps.forEach(p => { const q = Math.max(1, Math.round(num(val('rq_' + p.id), 1)));
      S.orders.push({id:uid(), po, productId:p.id, vendor:p.vendor, qty:q, recv:0, cost:+p.cost || 0, status:'open', date:nowIso()});
      logIt('Ordered', null, '', v, `${po} · qty ${q}`, p.id); }); });
  commit(`Created ${Object.keys(byV).length} PO(s)`);
}
function copyOrderList(){
  const sel = [...document.querySelectorAll('.roChk')].filter(c => c.checked).map(c => prod(c.dataset.id));
  if(!sel.length) return toast('Nothing selected');
  let txt = '', last = null;
  sel.forEach(p => { if(p.vendor !== last){ txt += `\n${p.vendor || '(no vendor)'}\n`; last = p.vendor; } txt += `  ${val('rq_' + p.id)} x ${plabel(p)}\n`; });
  txt = txt.trim(); const show = () => modal('Order list', `<textarea style="width:100%;height:240px">${esc(txt)}</textarea>`);
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast('Order list copied'), show); else show();
}
function cancelOrder(id){
  if(!needAdmin()) return;
  const o = S.orders.find(x => x.id === id);
  modal('Cancel order', `<div>Cancel ${esc(o.po)} — ${o.qty - (o.recv || 0)} remaining of ${esc(plabel(prod(o.productId)))}?</div>`,
    [{label:'Keep'}, {label:'Cancel order', cls:'danger', fn:() => { o.status = 'cancelled'; logIt('Order cancelled', null, '', o.vendor, o.po, o.productId); commit('Order cancelled'); }}]);
}
function manualOrderModal(){
  if(!needAdmin()) return;
  if(!S.products.length) return toast('Add a product first');
  const p0 = S.products[0];
  modal('Manual order', `<div class="fgrid">
    ${field('Product', `<select id="moP" onchange="const p=prod(this.value);document.getElementById('moV').value=p.vendor||'';document.getElementById('moQ').value=p.reorderQty||1">${productOptions(p0.id)}</select>`, 'full')}
    ${field('Qty', `<input id="moQ" type="number" min="1" value="${p0.reorderQty || 1}">`)}${field('Vendor', `<input id="moV" value="${esc(p0.vendor)}">`)}
    ${field('PO #', `<input id="moPo" value="${nextPO()}">`, 'full')}</div>`,
    [{label:'Cancel'}, {label:'Create order', cls:'pri', fn:() => {
      const p = prod(val('moP')), q = Math.round(num(val('moQ'))); if(q < 1){ toast('Qty must be ≥ 1'); return false; }
      S.orders.push({id:uid(), po:val('moPo') || nextPO(), productId:p.id, vendor:val('moV'), qty:q, recv:0, cost:+p.cost || 0, status:'open', date:nowIso()});
      logIt('Ordered', null, '', val('moV'), `${val('moPo')} · qty ${q}`, p.id); commit('Order created'); }}]);
}

function logTable(rows){

}

function renderSettings(){

  const lrows = S.locations.map(l => `<tr><td>${esc(l.name)}</td><td>${l.kind}</td><td class="mute">${l.kind === 'machine' ? esc(l.model || '') : esc(slotsFor(l).join(', '))}</td>

  return `<div class="grid2">

// Add / edit one tool (serial). Product fields are shared by every serial with the same part #.
function unitModal(uid_, presetPid){
  if(!cabinets().length) return toast('Add a cabinet in Settings first');
  const u = uid_ ? unit(uid_) : null;
  const p = u ? prod(u.productId) : (presetPid ? prod(presetPid) : null) || {name:'', partNo:'', type:TYPES[0], vendor:'', cost:0, reorderPoint:0};
  const cur = u ? {locId:u.locId, slot:u.slot} : homeOf(null);
  modal(u ? `Edit tool ${u.serial}` : 'Add tool', `<div class="fgrid">
    ${field('Serial #', `<div class="inrow"><input id="uS" value="${esc(u ? u.serial : '')}"><button type="button" class="btn scanbtn" title="Scan with camera" onclick="openScanner(c=>{document.getElementById('uS').value=c;})">${SCAN_ICO}</button></div>`)}${field('Batch #', `<input id="uB" value="${esc(u ? u.batch : '')}">`)}
    ${field('Product name', `<input id="uN" value="${esc(p.name)}" placeholder="e.g. 2cm T Edge Pos 1">`)}
    ${field('Vendor part #', `<input id="uP" value="${esc(p.partNo)}" oninput="fillFromPart(this.value)">`)}
    ${field('Type', `<select id="uT">${TYPES.map(x => `<option ${x === p.type ? 'selected' : ''}>${x}</option>`).join('')}</select>`)}${field('Vendor', `<input id="uV" value="${esc(p.vendor)}">`)}
    ${field('Cost', `<input id="uC" type="number" step="0.01" min="0" value="${p.cost}">`)}${field('Re-order point', `<input id="uR" type="number" min="0" value="${p.reorderPoint}">`)}
    ${u ? '' : field('Location', `<select id="uL">${anyLocOptions(cur)}</select>`) + field('Condition', `<select id="uCo">${CONDS.map(c => `<option value="${c}">${c === 'new' ? 'new' : 'EDM'}</option>`).join('')}</select>`)}</div>
    <div class="note" id="uHint">Type, vendor, cost and re-order point are shared by every serial with the same part #.</div>`,
    [...(u && isAdmin() ? [{label:'Delete', cls:'danger left', fn:() => { if(!confirm(`Delete serial ${u.serial}? (Use Scrap if the tool was worn out or broken.)`)) return false;
        logIt('Deleted', u, where(u), '', 'Entry removed'); S.units = S.units.filter(x => x.id !== u.id); commit('Tool deleted'); }}] : []),
     {label:'Cancel'}, ...(u ? [] : [{label:'Save & add another', fn:() => saveUnit(null, true)}]), {label:'Save', cls:'pri', fn:() => saveUnit(u)}]);
  // operators can add serials to an existing product but not change the product itself
  if(!isAdmin() && (u || presetPid)) ['uN','uP','uT','uV','uC','uR'].forEach(id => document.getElementById(id).disabled = true);
}
function fillFromPart(v){
  const p = findProduct(v, ''); const h = document.getElementById('uHint');
  if(!isAdmin()) ['uN','uT','uV','uC','uR'].forEach(id => document.getElementById(id).disabled = false);
  if(!p){ if(h) h.textContent = v.trim() ? 'New part # — a new product will be created.' : 'Type, vendor, cost and re-order point are shared by every serial with the same part #.'; return; }
  document.getElementById('uN').value = p.name; document.getElementById('uT').value = p.type; document.getElementById('uV').value = p.vendor;
  document.getElementById('uC').value = p.cost; document.getElementById('uR').value = p.reorderPoint;
  if(h) h.textContent = `Existing product: ${plabel(p)} (${unitsOf(p.id).length} serial(s) on hand).` + (isAdmin() ? '' : ' Only an admin can change its details.');
  if(!isAdmin()) ['uN','uT','uV','uC','uR'].forEach(id => document.getElementById(id).disabled = true);
}
function saveUnit(u, again){
  const serial = val('uS').trim(), name = val('uN').trim(), partNo = val('uP').trim();
  if(!serial){ toast('Serial # is required'); return false; }
  if(!name){ toast('Product name is required'); return false; }
  const dup = unitBySerial(serial); if(dup && dup !== u){ toast(`Serial ${serial} already exists (${where(dup)})`); return false; }
  const existing = findProduct(partNo, name);
  const p = !isAdmin() && existing ? existing : upsertProduct({name, partNo, type:val('uT'), vendor:val('uV').trim(), cost:num(val('uC')), reorderPoint:Math.max(0, Math.round(num(val('uR'))))});
  if(u){ u.serial = serial; u.batch = val('uB').trim(); u.productId = p.id; logIt('Edited', u, '', '', ''); commit('Tool updated'); return; }
  const {locId, slot} = splitLoc(val('uL'));
  const n = {id:uid(), serial, productId:p.id, batch:val('uB').trim(), locId, slot, cond:val('uCo'), added:nowIso()};
  S.units.push(n); logIt('Added', n, '', where(n), ''); save(); render(); toast(`Added ${serial}`);
  if(again){ document.getElementById('uS').value = ''; document.getElementById('uB').value = ''; document.getElementById('uS').focus(); return false; }
}

function receiveModal(pid, orderId){
  if(!S.products.length) return toast('Add a tool first (+ Add tool)');
  if(!cabinets().length) return toast('Add a cabinet in Settings first');
  const o = orderId ? S.orders.find(x => x.id === orderId) : null;
  const p = prod(pid || (o && o.productId)) || S.products[0];
  const openFor = S.orders.filter(x => x.productId === p.id && x.status === 'open');
  const firstOfP = unitsOf(p.id, 'cabinet')[0];
  modal(o ? `Receive ${o.po}` : 'Receive tools', `<div class="fgrid">
    ${field('Product', `<select id="rcP" ${o ? 'disabled' : ''} onchange="receiveModal(this.value)">${productOptions(p.id)}</select>`, 'full')}
    ${field(`Serial #s (one per line)${o ? ` — ${o.qty - (o.recv || 0)} expected` : ''}`, `<div class="inrow"><textarea id="rcS" rows="5" placeholder="148702&#10;150444"></textarea>
      <button type="button" class="btn scanbtn" title="Scan serials with camera" onclick="openScanner(c=>{const t=document.getElementById('rcS');t.value=(t.value.trim()?t.value.trim()+'\\n':'')+c;},{continuous:true,title:'Scan serial #s — tap Done when finished'})">${SCAN_ICO}</button></div>`, 'full')}
    ${field('Batch #', `<input id="rcB">`)}${field('Condition', `<select id="rcC"><option value="new">new</option><option value="EDM">EDM</option></select>`)}
    ${field('Put in', `<select id="rcL">${binOptions(firstOfP ? {locId:firstOfP.locId, slot:firstOfP.slot} : homeOf(null))}</select>`, 'full')}
    ${!o && openFor.length ? field('Apply to open order', `<select id="rcO"><option value="">— none —</option>${openFor.map(x => `<option value="${x.id}">${esc(x.po)} (${x.qty - (x.recv || 0)} remaining)</option>`).join('')}</select>`, 'full') : ''}</div>`,
    [{label:'Cancel'}, {label:'Receive', cls:'pri', fn:() => {
      const serials = val('rcS').split(/[\n,;\t]+/).map(s => s.trim()).filter(Boolean);
      if(!serials.length){ toast('Enter at least one serial #'); return false; }
      const dupIn = serials.filter((s, i) => serials.findIndex(x => norm(x) === norm(s)) !== i);
      const exist = serials.filter(s => unitBySerial(s));
      if(dupIn.length || exist.length){ toast('Already exists / duplicated: ' + [...new Set(dupIn.concat(exist))].join(', ')); return false; }
      const {locId, slot} = splitLoc(val('rcL')), ord = o || (val('rcO') ? S.orders.find(x => x.id === val('rcO')) : null);
      serials.forEach(s => { const n = {id:uid(), serial:s, productId:p.id, batch:val('rcB').trim(), locId, slot, cond:val('rcC'), added:nowIso()};
        S.units.push(n); logIt('Received', n, ord ? ord.vendor : '', where(n), ord ? ord.po : ''); });
      if(ord){ ord.recv = (ord.recv || 0) + serials.length; if(ord.recv >= ord.qty){ ord.status = 'received'; ord.receivedAt = nowIso(); } }
      commit(`Received ${serials.length} × ${p.name}`); }}]);
}

// Paste rows copied straight from the CNC Tooling screen (or "serial, product - part#, batch")
function parsePaste(text){
  const rows = [];
  text.split(/\r?\n/).forEach(line => {
    if(!line.trim() || /serial number|product variant/i.test(line)) return;
    let cells = line.includes('\t') ? line.split('\t') : line.split(/\s{2,}|,|\|/);
    cells = cells.map(c => c.trim());
    let variant, serial, batch;
    if(cells.length >= 8){ variant = cells[0]; serial = cells[6]; batch = cells[7]; }
    else {
      const vi = cells.findIndex(c => / - /.test(c) || /cnc tooling/i.test(c));
      variant = vi >= 0 ? cells[vi] : '';
      const rest = cells.filter((c, i) => i !== vi && c !== '');
      const si = rest.findIndex(c => /^\d{4,}$/.test(c));
      serial = si >= 0 ? rest[si] : rest[0]; batch = rest.filter((c, i) => i !== (si >= 0 ? si : 0)).pop() || '';
    }
    const {name, partNo} = parseVariant(variant);
    rows.push({serial, name, partNo, batch});
  });
  return rows;
}

    ${field('Rows', `<textarea id="ipT" rows="9" oninput="importPreview()" placeholder="CNC Tooling 2cm T Edge Pos 1 - 935124 [tab] … [tab] 122259 [tab] 203785 / 10"></textarea>`)}
    <div id="ipPrev" class="mute"></div>
    <div class="fgrid">${field('Put new tools in', `<select id="ipL">${anyLocOptions(homeOf(null))}</select>`)}
      ${field('Type for new products', `<select id="ipTy">${TYPES.map(x => `<option>${x}</option>`).join('')}</select>`)}
      ${field('Condition', `<select id="ipC"><option value="new">new</option><option value="EDM">EDM</option></select>`)}</div>`,
    [{label:'Cancel'}, {label:'Import', cls:'pri', fn:() => {
      const rows = parsePaste(val('ipT')); if(!rows.length){ toast('Nothing to import'); return false; }
      const {locId, slot} = splitLoc(val('ipL'));

}
function importPreview(){
  const rows = parsePaste(val('ipT')), el = document.getElementById('ipPrev'); if(!el) return;
  if(!rows.length){ el.innerHTML = ''; return; }
  el.innerHTML = `<div class="tablewrap" style="max-height:220px;overflow:auto"><table><tr><th>Serial #</th><th>Product</th><th>Part #</th><th>Batch #</th><th></th></tr>${rows.slice(0, 200).map(r =>

  modal(id ? `Edit ${l.name}` : `New ${k}`, `<div class="fgrid">${field('Name', `<input id="lN" value="${esc(l.name)}">`, 'full')}

     {label:'Cancel'}, {label:'Save', cls:'pri', fn:() => {
        const name = val('lN').trim(); if(!name){ toast('Name required'); return false; }

        if(k === 'machine') t.model = val('lM'); else { t.bins = val('lB').split(/\n|,/).map(x => x.trim()).filter(Boolean); if(!t.bins.length) t.bins = ['Main']; }
        if(id && k === 'cabinet'){ const orphan = S.units.filter(u => u.locId === id && !t.bins.includes(u.slot));
          if(orphan.length){ toast('Move tools out of removed bins first: ' + [...new Set(orphan.map(u => u.slot))].join(', ')); return false; } }
        Object.assign(o, t); if(!id) S.locations.push(o); commit(id ? 'Location updated' : 'Location added'); }}]);
}

/* ---------- scanning: phone camera (html5-qrcode) or a USB/Bluetooth scanner that types ---------- */
const SCAN_ICO = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M16.5 8v8"/></svg>`;
let scanner = null, scanLib = null, scanHandler = null;
function loadScanLib(){
  if(window.Html5Qrcode) return Promise.resolve();
  return scanLib ||= new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'html5-qrcode.min.js';
    s.onload = res; s.onerror = () => { scanLib = null; rej(new Error('scanner file missing — use the installed app')); }; document.head.appendChild(s); });
}
function openScanner(onCode, opts = {}){
  const continuous = !!opts.continuous, seen = new Set(); let last = '', lastT = 0;
  $('#scanTitle').textContent = opts.title || 'Scan serial #'; $('#scanList').innerHTML = ''; $('#scanManual').value = '';
  $('#scanReader').innerHTML = ''; $('#scanOv').classList.remove('hidden');
  scanHandler = txt => {
    txt = String(txt || '').trim(); if(!txt) return; const t = Date.now();
    if(txt === last && t - lastT < 2000) return; last = txt; lastT = t;
    if(navigator.vibrate) navigator.vibrate(60);
    if(continuous){ if(seen.has(txt)) return; seen.add(txt); onCode(txt); $('#scanList').insertAdjacentHTML('afterbegin', `<span class="chip">${esc(txt)}</span>`); }
    else { closeScanner(); onCode(txt); }
  };
  loadScanLib().then(() => {
    scanner = new Html5Qrcode('scanReader', {verbose:false, experimentalFeatures:{useBarCodeDetectorIfSupported:true}});
    return scanner.start({facingMode:'environment'}, {fps:12, qrbox:(w, h) => ({width:Math.floor(Math.min(w * 0.85, 380)), height:Math.floor(Math.min(h * 0.45, 170))})}, scanHandler, () => {});
  }).catch(err => {
    scanner = null;
    $('#scanReader').innerHTML = `<div class="note warn" style="margin:10px">Camera not available (${esc(err && err.message || err || 'permission denied')}). Type the serial # or use a USB/Bluetooth scanner below.</div>`;
    if(!IS_TOUCH) $('#scanManual').focus();
  });
}
function scanTyped(){ const i = $('#scanManual'); const v = i.value; i.value = ''; if(scanHandler) scanHandler(v); }
function closeScanner(){
  $('#scanOv').classList.add('hidden'); scanHandler = null;
  const s = scanner; scanner = null;
  if(s){ try{ s.stop().then(() => s.clear()).catch(() => {}); }catch(e){} }
}
// Header "Scan": find a tool by serial and show its card
function scanFind(){ openScanner(findSerial, {title:'Scan a tool’s serial #'}); }
function findSerial(code){
  const u = unitBySerial(code); if(u) return unitCard(u.id);
  modal('Serial not found', `<div>No tool with serial <b class="code">${esc(code)}</b>.</div>`,
    [{label:'Close'}, {label:'Add as new tool', cls:'pri', fn:() => { unitModal(); document.getElementById('uS').value = code; return false; }}]);
}
function unitCard(id){
  const u = unit(id); if(!u) return; const p = prod(u.productId) || {};
  const hist = S.log.filter(l => l.serial === u.serial).slice(0, 8);
  modal(`Serial ${u.serial}`, `<div class="ucard"><div class="big">${esc(p.name || '')}</div>
    <div class="mute">Part # ${esc(p.partNo || '—')} · Batch # ${esc(u.batch || '—')} · ${esc(p.type || '')}${p.vendor ? ' · ' + esc(p.vendor) : ''}</div></div>
    <div class="row"><span class="badge b-ord" style="font-size:12px">${esc(where(u))}</span>${condBadge(u.cond)}</div>
    <div class="row">${unitActions(u)}</div>
    ${hist.length ? `<div><label>History</label>${hist.map(l => `<div class="mute">${fdt(l.ts)} · ${esc(l.action)}${l.from ? ' · ' + esc(l.from) : ''}${l.to ? ' → ' + esc(l.to) : ''}</div>`).join('')}</div>` : ''}`, [{label:'Close'}]);
}

/* ---------- installable app (PWA) ---------- */
let installPrompt = null;
const IS_APP = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if(view === 'settings') render(); });
window.addEventListener('appinstalled', () => { installPrompt = null; toast('Trindco Tool Crib installed'); if(view === 'settings') render(); });
function installApp(){ if(!installPrompt) return; installPrompt.prompt(); installPrompt.userChoice.finally(() => { installPrompt = null; render(); }); }
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).then(r => r.update()).catch(() => {});
if(navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
function installCard(){
  const how = IS_APP ? '<div class="note">✓ Running as the installed app.</div>'
    : installPrompt ? `<button class="btn pri" onclick="installApp()">Install Trindco Tool Crib</button>`
    : `<div class="mute"><b>iPhone / iPad:</b> open the link in Safari → Share → <b>Add to Home Screen</b>.<br><b>Android:</b> Chrome menu ⋮ → <b>Install app</b>.<br><b>PC:</b> Chrome / Edge → install icon in the address bar.</div>`;
  return `<div class="card installcard"><div class="hd"><h3>App</h3></div><div class="bd">${how}
    <div class="note" style="margin-top:10px">${SYNC.on ? 'Inventory is shared live between every device that opens this link.' : 'Open the app from your Netlify link to share one live inventory between devices.'}</div></div></div>`;
}

/* ---------- import / export ---------- */
function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
const dateStamp = () => new Date().toISOString().slice(0, 10);
const csvCell = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
const toCSV = rows => rows.map(r => r.map(csvCell).join(',')).join('\n');
function exportJSON(){ download(`trindco-tool-crib-backup-${dateStamp()}.json`, JSON.stringify(S, null, 2), 'application/json'); }
function importJSON(input){
  if(!needAdmin()){ input.value = ''; return; }
  const f = input.files[0]; if(!f) return; const r = new FileReader();
  r.onload = () => { try{ const d = JSON.parse(r.result);
      if(!Array.isArray(d.products) || !Array.isArray(d.units) || !Array.isArray(d.locations)) throw 0;
      d.orders ||= []; d.log ||= []; d.settings ||= {user:'', reorderBasis:'cabinet'}; S = d; commit('Backup restored');
    }catch(e){ toast('Not a valid backup file for this version'); } input.value = ''; };
  r.readAsText(f);
}
function exportCSV(){
  download(`tool-inventory-${dateStamp()}.csv`, toCSV([['Serial #','Product','Part #','Batch #','Type','Vendor','Cost','Location','Bin','Condition'],
    ...sortUnits(S.units).map(u => { const p = prod(u.productId) || {}, l = loc(u.locId) || {}; return [u.serial, p.name, p.partNo, u.batch, p.type, p.vendor, p.cost, l.name, l.kind === 'machine' ? '' : u.slot, u.cond]; })]), 'text/csv');
}
function exportLogCSV(){
  download(`tool-history-${dateStamp()}.csv`, toCSV([['Time','Action','Serial #','Product','From','To','User','Note'], ...S.log.map(l => [l.ts, l.action, l.serial, l.pname, l.from, l.to, l.user, l.note])]), 'text/csv');
}
function resetModal(){
  if(!needAdmin()) return;
  modal('Reset data', `<div class="note warn">Replaces all tools, products, orders and history${SYNC.on ? ' <b>for everyone using the live inventory</b>' : ' in this browser'}. Cabinets and machines are kept. Back up first if you need it.</div>`,
    [{label:'Cancel'}, {label:'Reload starter list', fn:() => { S = starterState(S.locations, S.settings.user); commit('Starter list loaded'); }},
     {label:'Start empty', cls:'danger', fn:() => { S = emptyState(S.locations, S.settings.user); commit('Inventory cleared'); }}]);
}

/* ---------- boot ---------- */
function clearSearch(){ query = ''; $('#search').value = ''; render(); }
document.querySelectorAll('#nav button[data-v]').forEach(b => b.onclick = () => go(b.dataset.v));
$('#search').addEventListener('keydown', e => { if(e.key === 'Enter'){ const u = unitBySerial(e.target.value); if(u){ e.preventDefault(); unitCard(u.id); } } });
$('#search').addEventListener('input', e => { query = e.target.value.trim(); if(!['tools','cabinet','machines','products'].includes(view)) view = 'tools'; render(); });
$('#modalBack').addEventListener('mousedown', e => { if(e.target.id === 'modalBack') closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ if(!$('#scanOv').classList.contains('hidden')) closeScanner(); else closeModal(); } });
S = load(); if(ME) S.settings.user = ME.name; else if(lsGet('tcUser')) S.settings.user = lsGet('tcUser');
$('#loginLogo').src = $('#splash img').src;
if(/^https?:$/.test(location.protocol) && !lsGet('tcToken')) showLogin();   // live site: sign in first
snapshot(); save(); render(); initSync();
</script>
